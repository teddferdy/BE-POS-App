name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cashier_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Load dev schema into source DB
        run: >
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres
          -d cashier_app -f scripts/dev-schema.sql

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_DEV_HOST: localhost
          DB_DEV_PORT: 5432
          DB_DEV_USERNAME: postgres
          DB_DEV_PASSWORD: postgres
          DB_DEV_DATABASE: cashier_app
          DB_TEST_DATABASE: cashier_app_test
          JWT_SECRET_KEY: test-secret-key
          JWT_EXPIRED_IN: 1h

      - name: Run lint
        run: npx eslint api/ utils/ --max-warnings 0 || true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log deployment
        run: |
          echo "Deployment triggered by commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo "Timestamp: ${{ github.event.head_commit.timestamp }}"
